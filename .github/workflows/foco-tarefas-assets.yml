name: Foco Tarefas - PDF, capturas e testes

on:
  push:
    paths:
      - 'foco-tarefas/**'
      - '.github/workflows/foco-tarefas-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependencias de documentacao
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow reportlab cairosvg playwright
          python -m playwright install --with-deps chromium

      - name: Testes automatizados de logica
        run: |
          cd foco-tarefas
          node --test tests/core.test.js > docs/resultado-testes-node.txt
          cat docs/resultado-testes-node.txt

      - name: Gerar capturas reais do software e diagramas PNG
        run: |
          cd foco-tarefas
          python scripts/build_assets.py

      - name: Gerar relatorio tecnico completo em PDF
        run: |
          cd foco-tarefas
          python scripts/gerar_relatorio.py

      - name: Publicar artefatos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foco-tarefas/docs/
          if git diff --staged --quiet; then
            echo "Nenhuma alteracao nos artefatos."
          else
            git commit -m "docs: publica capturas e relatorio PDF [skip ci]"
            git push
          fi
