(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) root.FocoCore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const STORAGE_KEY = 'foco-tarefas-v1';
  const CATEGORIES = ['Estudos', 'Trabalho', 'Pessoal'];
  const PRIORITIES = ['Baixa', 'Média', 'Alta'];
  const STATUSES = ['Pendente', 'Em andamento', 'Concluída'];

  function validateTask(data) {
    const title = String(data.title || '').trim();
    if (!title || title.length > 80) throw new Error('Informe um título de até 80 caracteres.');
    const description = String(data.description || '').trim();
    if (description.length > 400) throw new Error('A descrição pode ter no máximo 400 caracteres.');
    const category = String(data.category || 'Pessoal');
    const priority = String(data.priority || 'Média');
    const status = String(data.status || 'Pendente');
    const dueDate = String(data.dueDate || '');
    if (!CATEGORIES.includes(category)) throw new Error('Categoria inválida.');
    if (!PRIORITIES.includes(priority)) throw new Error('Prioridade inválida.');
    if (!STATUSES.includes(status)) throw new Error('Status inválido.');
    if (dueDate && (!/^\d{4}-\d{2}-\d{2}$/.test(dueDate) || Number.isNaN(Date.parse(dueDate + 'T12:00:00')))) {
      throw new Error('Data inválida.');
    }
    return { title, description, category, priority, status, dueDate };
  }

  function normalizeRecord(record) {
    if (!record || typeof record !== 'object' || typeof record.id !== 'string' || !record.id.trim()) {
      throw new Error('Registro de tarefa inválido.');
    }
    const safe = validateTask(record);
    const createdAt = typeof record.createdAt === 'string' && !Number.isNaN(Date.parse(record.createdAt))
      ? record.createdAt : new Date().toISOString();
    const updatedAt = typeof record.updatedAt === 'string' && !Number.isNaN(Date.parse(record.updatedAt))
      ? record.updatedAt : createdAt;
    return { id: record.id, ...safe, createdAt, updatedAt };
  }

  function makeId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'task-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
  }

  class TaskManager {
    constructor(storage, options = {}) {
      this.storage = storage;
      this.key = options.key || STORAGE_KEY;
      this.now = options.now || (() => new Date().toISOString());
      this.id = options.id || makeId;
    }
    list() {
      try {
        const raw = this.storage.getItem(this.key);
        if (!raw) return [];
        const values = JSON.parse(raw);
        if (!Array.isArray(values)) return [];
        return values.map(normalizeRecord).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      } catch (_) {
        return [];
      }
    }
    _save(records) { this.storage.setItem(this.key, JSON.stringify(records)); }
    get(id) { return this.list().find(task => task.id === id) || null; }
    create(data) {
      const safe = validateTask(data);
      const now = this.now();
      const item = { id: this.id(), ...safe, createdAt: now, updatedAt: now };
      this._save([item, ...this.list()]);
      return item;
    }
    update(id, changes) {
      const tasks = this.list();
      const i = tasks.findIndex(task => task.id === id);
      if (i < 0) throw new Error('Tarefa não encontrada.');
      const safe = validateTask({ ...tasks[i], ...changes });
      tasks[i] = { ...tasks[i], ...safe, updatedAt: this.now() };
      this._save(tasks);
      return tasks[i];
    }
    remove(id) {
      const tasks = this.list();
      const next = tasks.filter(task => task.id !== id);
      if (tasks.length === next.length) return false;
      this._save(next);
      return true;
    }
    setStatus(id, status) { return this.update(id, { status }); }
    filter({ search = '', status = 'Todas', category = 'Todas' } = {}) {
      const term = String(search).trim().toLocaleLowerCase('pt-BR');
      return this.list().filter(task =>
        (status === 'Todas' || task.status === status) &&
        (category === 'Todas' || task.category === category) &&
        (!term || [task.title, task.description].some(field => field.toLocaleLowerCase('pt-BR').includes(term)))
      );
    }
    stats() {
      const tasks = this.list();
      const total = tasks.length;
      const complete = tasks.filter(task => task.status === 'Concluída').length;
      return { total, complete, pending: tasks.filter(task => task.status === 'Pendente').length,
        inProgress: tasks.filter(task => task.status === 'Em andamento').length,
        percent: total ? Math.round(100 * complete / total) : 0 };
    }
    exportData() { return JSON.stringify({ application: 'Foco Tarefas', version: 1, tasks: this.list() }, null, 2); }
    importData(json) {
      const parsed = typeof json === 'string' ? JSON.parse(json) : json;
      if (!parsed || !Array.isArray(parsed.tasks)) throw new Error('Arquivo incompatível: campo tasks ausente.');
      if (parsed.tasks.length > 1000) throw new Error('Limite de 1000 tarefas por importação.');
      const records = parsed.tasks.map(normalizeRecord);
      if (new Set(records.map(item => item.id)).size !== records.length) throw new Error('IDs repetidos no arquivo.');
      this._save(records);
      return records.length;
    }
  }

  return { TaskManager, STORAGE_KEY, CATEGORIES, PRIORITIES, STATUSES, validateTask, normalizeRecord };
});

</script><script>
(function () {

  let categoryFilter = 'Todas';
  let toastTimer;

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
  }
  function parseRoute() {
    const route = decodeURIComponent(location.hash.replace(/^#/, '')) || 'inicio';

  }
  const dateFmt = date => date ? new Date(date + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Sem prazo';

  function toast(message) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.hidden = false;

  }
  function pageHeader(eyebrow, title, subtitle, action = '') {

    </article>`;
  }

    return `<div class="empty"><span class="empty-icon">▣</span><h3>${isFilter?'Nenhuma tarefa encontrada':'Sua lista está em branco'}</h3><p>${isFilter?'Experimente outros filtros ou uma busca diferente.':'Comece adicionando uma tarefa e acompanhe seu progresso por aqui.'}</p>${isFilter?'':'<a href="#nova" class="button primary small">＋ Criar primeira tarefa</a>'}</div>`;
  }
  function dashboard() {
    const s = manager.stats();
    const recent = manager.list().filter(task => task.status !== 'Concluída').slice(0,4);
    app.innerHTML = `<div class="main">
      ${pageHeader('Seu painel', 'Olá! Vamos organizar o dia?', 'Uma visão simples de tudo o que você precisa fazer.', '<a class="button primary" href="#nova">＋ Nova tarefa</a>')}
      <section class="stats" aria-label="Indicadores de tarefas">
        <div class="stat-card"><div class="stat-icon">☷</div><strong>${s.total}</strong><span>Total de tarefas</span></div>
        <div class="stat-card"><div class="stat-icon amber">◷</div><strong>${s.pending}</strong><span>Pendentes</span></div>
        <div class="stat-card"><div class="stat-icon blue">↻</div><strong>${s.inProgress}</strong><span>Em andamento</span></div>
        <div class="stat-card"><div class="stat-icon green">✓</div><strong>${s.complete}</strong><span>Concluídas</span></div>
      </section>
      <section class="grid-2">
        <div class="panel"><div class="panel-header"><h2>Seu progresso</h2><span class="mini-link">Visão geral</span></div>
          <div class="progress-labels"><span>Conclusão das tarefas</span><strong>${s.percent}%</strong></div>
          <div class="progress-track" role="progressbar" aria-label="Progresso geral" aria-valuenow="${s.percent}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${s.percent}%"></div></div>
          <p class="progress-foot">${s.total ? `${s.complete} de ${s.total} tarefas finalizadas. Continue avançando no seu ritmo.` : 'Adicione sua primeira tarefa para começar a acompanhar seu progresso.'}</p>
        </div>
        <div class="panel"><div class="panel-header"><h2>Acesso rápido</h2></div>
          <a class="quick-action" href="#nova"><span class="quick-icon">＋</span><div><div class="quick-title">Adicionar nova tarefa</div><div class="quick-sub">Registre algo importante</div></div></a>
          <a class="quick-action" href="#tarefas"><span class="quick-icon">☷</span><div><div class="quick-title">Ver todas as tarefas</div><div class="quick-sub">Organize e acompanhe sua lista</div></div></a>
        </div>
      </section>
      <section class="next-list"><div class="section-heading"><h2>Próximas tarefas</h2><a class="mini-link" href="#tarefas">Ver todas →</a></div>
      ${recent.length ? recent.map(card).join('') : empty(false)}</section>
    </div>`;
  }
  function taskList() {
    const values = manager.filter({ search, status:statusFilter, category:categoryFilter });
    app.innerHTML = `<div class="main">
      ${pageHeader('Organização', 'Minhas tarefas', 'Encontre, atualize e organize tudo em um só lugar.', '<a class="button primary" href="#nova">＋ Nova tarefa</a>')}
      <div class="list-panel"><div class="list-header"><h2>Lista de tarefas <span class="muted">(${values.length})</span></h2><div class="tools-row"><button class="button secondary small" id="export-btn" type="button">↓ Exportar JSON</button><button class="button secondary small" id="import-btn" type="button">↑ Importar JSON</button></div></div>
      <div class="filter-bar"><div class="search-wrap"><input class="search" id="search-tasks" placeholder="Buscar pelo título ou descrição..." aria-label="Buscar tarefas" value="${escapeHtml(search)}"></div>
      <select class="field" id="filter-status" aria-label="Filtrar por status"><option>Todas</option>${window.FocoCore.STATUSES.map(v=>`<option ${statusFilter===v?'selected':''}>${v}</option>`).join('')}</select>
      <select class="field" id="filter-category" aria-label="Filtrar por categoria"><option>Todas</option>${window.FocoCore.CATEGORIES.map(v=>`<option ${categoryFilter===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div id="task-list" class="task-list">${values.length?values.map(card).join(''):empty(Boolean(search||statusFilter!=='Todas'||categoryFilter!=='Todas'))}</div></div>
    </div>`;
  }
  function form(id) {
    const item = id ? manager.get(id) : null;
    if (id && !item) { location.hash = '#tarefas'; toast('Esta tarefa não foi encontrada.'); return; }
    const task = item || { title:'',description:'',category:'Estudos',priority:'Média',status:'Pendente',dueDate:'' };
    const edit = Boolean(item);
    app.innerHTML = `<div class="main">
      ${pageHeader('Planejamento', edit?'Editar tarefa':'Criar nova tarefa', edit?'Atualize as informações e salve as alterações.':'Preencha os campos abaixo para adicionar uma tarefa à sua lista.')}
      <div class="form-panel"><form id="task-form" novalidate>
        <div id="form-error" class="alert" role="alert" hidden></div>
        <div class="field-group"><label class="field-label" for="task-title">Título da tarefa <span class="required">*</span></label><input class="field" id="task-title" maxlength="80" required placeholder="Ex.: Finalizar atividade de Engenharia de Software" value="${escapeHtml(task.title)}"><div class="form-hint">Máximo de 80 caracteres.</div></div>
        <div class="field-group"><label class="field-label" for="task-description">Descrição</label><textarea class="field text-area" id="task-description" maxlength="400" placeholder="Adicione detalhes, se necessário...">${escapeHtml(task.description)}</textarea></div>
        <div class="form-grid"><div class="field-group"><label class="field-label" for="task-category">Categoria</label><select class="field" id="task-category">${window.FocoCore.CATEGORIES.map(v=>`<option ${task.category===v?'selected':''}>${v}</option>`).join('')}</select></div>
        <div class="field-group"><label class="field-label" for="task-priority">Prioridade</label><select class="field" id="task-priority">${window.FocoCore.PRIORITIES.map(v=>`<option ${task.priority===v?'selected':''}>${v}</option>`).join('')}</select></div>
        <div class="field-group"><label class="field-label" for="task-status">Status</label><select class="field" id="task-status">${window.FocoCore.STATUSES.map(v=>`<option ${task.status===v?'selected':''}>${v}</option>`).join('')}</select></div>
        <div class="field-group"><label class="field-label" for="task-due">Data limite</label><input class="field" type="date" id="task-due" value="${escapeHtml(task.dueDate)}"></div></div>
        <div class="form-actions"><a class="button secondary" href="#tarefas">Cancelar</a><button type="submit" class="button primary">${edit?'Salvar alterações':'✓ Salvar tarefa'}</button></div>
      </form></div>
    </div>`;
    document.getElementById('task-form').addEventListener('submit', event => {
      event.preventDefault();
      const data = {title:document.getElementById('task-title').value,description:document.getElementById('task-description').value,
        category:document.getElementById('task-category').value,priority:document.getElementById('task-priority').value,
        status:document.getElementById('task-status').value,dueDate:document.getElementById('task-due').value};
      try {
        if (edit) manager.update(item.id, data); else manager.create(data);
        location.hash = '#tarefas';
        toast(edit?'Tarefa atualizada com sucesso!':'Tarefa criada com sucesso!');
        render();
      } catch (error) { const el=document.getElementById('form-error');el.textContent=error.message;el.hidden=false; }
    });
  }
  function render() {
    const { path, id } = parseRoute();
    const route = ['inicio','tarefas','nova','editar'].includes(path) ? path : 'inicio';
    const titles = { inicio:'Visão geral', tarefas:'Minhas tarefas', nova:'Nova tarefa', editar:'Editar tarefa' };
    crumb.textContent = titles[route];
    nav.forEach(el => el.classList.toggle('active', el.dataset.route === (route==='editar'?'tarefas':route)));
    if (route==='tarefas') taskList(); else if (route==='nova'||route==='editar') form(route==='editar'?id:null); else dashboard();
  }
  app.addEventListener('click', event => {
    const target = event.target.closest('[data-action]');
    if (!target) return;
    const id = target.closest('[data-id]')?.dataset.id;
    if (!id) return;
    const task = manager.get(id);
    if (!task) return;
    if (target.dataset.action==='edit') location.hash='#editar/'+encodeURIComponent(id);
    if (target.dataset.action==='delete') {
      if (window.confirm(`Excluir a tarefa "${task.title}"?`)) { manager.remove(id); render(); toast('Tarefa excluída.'); }
    }
  });
  app.addEventListener('change', event => {
    if (event.target.matches('[data-action="toggle"]')) {
      const id = event.target.closest('[data-id]')?.dataset.id;
      if (id) { manager.setStatus(id,event.target.checked?'Concluída':'Pendente'); render(); toast('Status atualizado.'); }
    }
    if (event.target.id==='filter-status') { statusFilter=event.target.value;taskList(); }
    if (event.target.id==='filter-category') { categoryFilter=event.target.value;taskList(); }
  });
  app.addEventListener('input', event => {
    if (event.target.id==='search-tasks') {
      search=event.target.value;
      const selected=event.target.selectionStart;
      taskList();
      const input=document.getElementById('search-tasks');input.focus();input.setSelectionRange(selected,selected);
    }
  });
  app.addEventListener('click', event => {
    if (event.target.closest('#export-btn')) {
      const blob = new Blob([manager.exportData()], {type:'application/json;charset=utf-8'});
      const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='foco-tarefas-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
      toast('Backup gerado com sucesso.');
    }
    if (event.target.closest('#import-btn')) { importer.value='';importer.click(); }
  });
  importer.addEventListener('change', async () => {
    const file=importer.files && importer.files[0];if(!file)return;
    if (!window.confirm('Importar este arquivo substituirá as tarefas atuais. Continuar?')) return;
    try { const n=manager.importData(await file.text()); render();toast(`${n} tarefa(s) importada(s).`); }
    catch (error) { toast('Não foi possível importar: '+error.message); }
  });
  document.getElementById('current-date').textContent = today();
  window.addEventListener('hashchange', render);
  render();
  window.__focoApp = { manager, render }; // utilitário para execução automatizada de testes locais
})();

</script></body>
</html>
