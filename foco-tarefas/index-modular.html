<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1D2444">
  <title>Foco — Organize seu dia</title>
  <link rel="stylesheet" href="css/styles.css">
  
  
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Menu principal">
      <a class="brand" href="#inicio" aria-label="Foco, página inicial">
        <span class="brand-mark">✦</span><span>foco<span class="brand-period">.</span></span>
      </a>
      <div class="menu-label">MENU PRINCIPAL</div>
      <nav class="nav">
        <a href="#inicio" data-route="inicio"><span class="nav-icon">◫</span> Visão geral</a>
        <a href="#tarefas" data-route="tarefas"><span class="nav-icon">☷</span> Minhas tarefas</a>
        <a href="#nova" data-route="nova"><span class="nav-icon">＋</span> Nova tarefa</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="tip-icon">✳</div>
        <strong>Um passo por vez.</strong>
        <p>Organize suas tarefas e acompanhe cada pequena conquista.</p>
        <div class="offline-note"><span class="dot"></span> Seus dados ficam neste navegador</div>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <span class="mobile-brand">✦ foco<span>.</span></span>
        <div class="crumb">ESPAÇO DE PRODUTIVIDADE <span> / </span> <strong id="crumb-current">Visão geral</strong></div>
        <span class="topbar-date" id="current-date"></span>
      </header>
      <main id="app" tabindex="-1" aria-live="polite"></main>
      <footer class="footer">Foco Tarefas <span>·</span> Simples, funcional e feito para o seu dia.</footer>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden aria-label="Importar tarefas do JSON">
<script src="js/core.js" defer></script><script src="js/app.js" defer></script></body>
</html>
